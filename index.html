<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang Cập Nhật Chính Sách sản phẩm mới nhất</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5eae4 0%, #ecc1b2 50%, #d49a89 100%);
            --text-main: #0f3132;
            --text-sub: #5c7172;
            --flamingo-color: #e58e73;
            --flamingo-dark: #b86248;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-main);
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px 20px;
            z-index: 2;
            position: relative;
        }

        /* --- Nghệ thuật tạo hình bầy hồng hạc bằng CSS --- */
        .flamingo-scene {
            position: relative;
            width: 100%;
            height: 220px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* Chân đế/Mặt nước */
        .water-line {
            position: absolute;
            bottom: 15px;
            width: 280px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--text-main), transparent);
            opacity: 0.3;
        }

        .flamingo {
            position: relative;
            width: 60px;
            height: 160px;
            margin: 0 10px;
            transform-origin: bottom center;
        }

        /* Chi tiết con hồng hạc chính */
        .flamingo .body {
            position: absolute;
            top: 40px;
            left: 5px;
            width: 50px;
            height: 35px;
            background: var(--flamingo-color);
            border-radius: 50px 40px 40px 40px;
            transform: rotate(-10deg);
            box-shadow: inset -5px -5px 10px var(--flamingo-dark);
        }

        .flamingo .neck {
            position: absolute;
            top: 10px;
            right: 8px;
            width: 12px;
            height: 45px;
            border-right: 8px solid var(--flamingo-color);
            border-radius: 0 25px 0 0;
            transform: rotate(15deg);
        }

        .flamingo .head {
            position: absolute;
            top: 2px;
            right: 0px;
            width: 16px;
            height: 14px;
            background: var(--flamingo-color);
            border-radius: 50%;
        }

        .flamingo .beak {
            position: absolute;
            top: 6px;
            right: -10px;
            width: 12px;
            height: 8px;
            background: var(--text-main);
            clip-path: polygon(0 0, 100% 50%, 0 100%);
            transform: rotate(20deg);
        }

        .flamingo .legs {
            position: absolute;
            bottom: 15px;
            left: 25px;
            width: 2px;
            height: 75px;
            background: var(--flamingo-dark);
        }

        /* Chân đứng co (đặc trưng của hồng hạc) */
        .flamingo .legs::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 0;
            width: 25px;
            height: 2px;
            background: var(--flamingo-dark);
            transform: rotate(45deg);
            transform-origin: left center;
        }

        /* Tạo biến thể cho bầy chim (Kích thước và hiệu ứng động) */
        .flamingo.f1 {
            transform: scale(0.95);
            animation: float 4s ease-in-out infinite alternate;
        }

        .flamingo.f2 {
            transform: scale(1.1) scaleX(-1); /* Quay mặt hướng ngược lại */
            filter: brightness(0.9);
            animation: float 4.5s ease-in-out infinite alternate-reverse;
            margin-bottom: -5px;
        }

        .flamingo.f3 {
            transform: scale(0.85);
            filter: brightness(0.8);
            animation: float 3.8s ease-in-out infinite alternate;
            margin-bottom: 5px;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(var(--tw-scale-x, 1)); }
            100% { transform: translateY(-6px) scale(var(--tw-scale-x, 1)); }
        }

        /* --- Phần nội dung thông báo --- */
        .content h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .content p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-sub);
            margin-bottom: 30px;
        }

        /* Thanh tiến trình chạy ngầm tinh tế */
        .progress-bar {
            width: 180px;
            height: 3px;
            background: rgba(15, 49, 50, 0.1);
            margin: 0 auto 25px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--text-main);
            animation: loading 2.5s infinite linear;
        }

        @keyframes loading {
            0% { left: -100%; }
            50% { left: 0; }
            100% { left: 100%; }
        }

        .footer {
            font-size: 0.85rem;
            color: var(--text-sub);
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="flamingo-scene">
            <div class="flamingo f1">
                <div class="neck"></div>
                <div class="head"><div class="beak"></div></div>
                <div class="body"></div>
                <div class="legs"></div>
            </div>
            
            <div class="flamingo f2">
                <div class="neck"></div>
                <div class="head"><div class="beak"></div></div>
                <div class="body"></div>
                <div class="legs"></div>
            </div>

            <div class="flamingo f3">
                <div class="neck"></div>
                <div class="head"><div class="beak"></div></div>
                <div class="body"></div>
                <div class="legs"></div>
            </div>
            
            <div class="water-line"></div>
        </div>

        <div class="content">
            <h1>Chính Sách Đang Cập Nhật</h1>
            <p>Chúng tôi đang tiến hành cập nhật theo các nội dung mới của chính sách.</p>
 <p>Mọi thông tin xin liên hệ 096 293 8816.</p>
        </div>


        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <div class="footer">
            Cảm ơn bạn đã quan tâm,
 &copy;R&D - FLV 2026
        </div>
    </div>

</body>
</html>
